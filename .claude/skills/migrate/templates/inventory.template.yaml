# etl/<ETL-ID>/inventory.yaml -- single source of truth for what one legacy ETL does.
# Written by `analyze`; `implement` fills target_loc; `verify-loop` fills evidence.
etl_id: ETL-001
name: ""
legacy_files: []             # files/units that make up this ETL
depends_on: []               # other ETL ids that must run first
operations:
  - op_id: ETL-001/OP-01     # never renumbered or reused
    type: read               # read|filter|lookup|join|transform|aggregate|write|side-effect
    source_loc: ""           # legacy file:line[-line]
    inputs: []               # dataset.column ...
    rule: ""                 # what it does, in plain words
    outputs: []
    implicit:                # answered for every op; evidence = file:line
      null_handling: {applies: false, note: "", loc: ""}
      trim: {applies: false, note: "", loc: ""}
      codepage: {applies: false, note: "", loc: ""}
      rounding: {applies: false, note: "", loc: ""}
      empty_date_sentinel: {applies: false, note: "", loc: ""}
      ordering_dependency: {applies: false, note: "", loc: ""}
      global_or_event_effect: {applies: false, note: "", loc: ""}
      swallowed_exception: {applies: false, note: "", loc: ""}
    confidence: inferred     # inferred | confirmed | needs_human
    target_loc: ""           # Java Class#method
    evidence: ""             # results/compare/run-NNN.json that last verified it
