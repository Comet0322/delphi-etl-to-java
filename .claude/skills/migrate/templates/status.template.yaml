# status.yaml -- a new session reads ONLY this file to take over.
mode: interactive
stage: analyze               # analyze | clarify | implement | verify | closeout | done
charter: none                # none | draft | confirmed
assumed_count: 0
etls:
  ETL-001:
    stage: pending           # pending|analyzed|implemented|verifying|done|blocked
    runs: 0
    last_diff_count: null
    blocked:
      code: ""               # from verify_gate (e.g. same_fingerprint) or: needs_decision | missing_input
      tried: []              # what was attempted
      needs: ""              # exactly what a human must decide or provide
