# charter.yaml -- written by the `clarify` step, frozen afterwards.
# Do NOT edit during a run. Changes go through: scripts/freeze.py unfreeze "<reason>" (human only).
version: 1
mode: interactive            # interactive | unattended  (unattended => unresolved questions use defaults, source: assumed)
status: draft                # draft | confirmed         (draft while any decision has source: assumed)

legacy:
  language: delphi
  source_dir: legacy/src
  utf8_copy_dir: legacy/src_utf8   # analysis reads this copy, never the original

target:
  language: java
  java_version: 8
  build: maven
  template: ""               # path to a template project to copy; empty = minimal Maven project
  package: etl
  dir: target-project

domain_knowledge:
  path: ""                   # directory of the domain-knowledge skill (SKILL.md, rule.md, template-project/)

# How baseline vs candidate data are reached is described by the domain
# knowledge and by compare.yaml; the workflow itself does not know.
compare:
  config: compare.yaml

done:
  max_diffs: 0

blocked:                     # machine-judged by scripts/verify_gate.py
  same_fingerprint_runs: 3   # same diff set N runs in a row
  no_progress_runs: 4        # no new minimum diff count for K runs
  max_attempts: 8            # runs per ETL

# Every decision made at clarify time. Nothing here is asked about syntax or
# preserved legacy semantics; only architecture / library / deviation choices.
decisions:
  # - key: architecture.layout
  #   value: one EtlJob per legacy ETL
  #   source: skill            # user | skill | assumed
  #   affects: []              # op_ids impacted if this is later overturned

frozen_extra: []             # extra glob patterns to freeze (e.g. domain-knowledge files)
