  inputs:
  - cust_notes.txt
  rule: Read notes file line by line; skip lines shorter than 5 bytes; id = trimmed bytes 1-4 (StrToIntDef, 0 on bad); note = bytes 5-24, Big5/CP950
    decoded to UTF-8, right-trimmed; later line with same id overwrites earlier
  outputs:
  - notes map id->note
  implicit:
    null_handling:
      applies: true
      note: unparsable id becomes 0, not an error
      loc: uCustomer.pas:31
    trim:
      applies: true
      note: Trim on id field, TrimRight on decoded note
      loc: uCustomer.pas:31,35
    codepage:
      applies: true
      note: note bytes are Big5 (CP950) via SetCodePage 950 then UTF-8
      loc: uCustomer.pas:33-34
    rounding:
      applies: false
      note: ''
      loc: ''
    empty_date_sentinel:
      applies: false
      note: ''
      loc: ''
    ordering_dependency:
      applies: false
      note: ''
      loc: ''
    global_or_event_effect:
